server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly if they exist
    location / {
        try_files $uri $uri/ /index.html;
    }

    # React build emits cached assets under /static
    location /static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }
}
